name: Deploy to Local Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # Use 'self-hosted' so the job is picked up by your local machine
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Update and Restart
        run: |
          # 1. Navigate to project folder on your local server
          cd ~/central-soc
          
          # 2. Update code
          git pull origin main
          
          # 3. Rebuild and restart services
          # It's important to run this locally on the host
          make up
          
          # 4. Clean up old images (optional)
          docker image prune -f
